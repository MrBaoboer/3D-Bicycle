name: 检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 两条作业挂在不同时机：工具链每个 PR 都跑（几十秒），
# 冒烟只在推到 main 之后跑或手动触发（分钟级）——
# 不让每个 PR 为一次浏览器走查等上几分钟。
jobs:
  # 作业 id 必须是 ASCII（字母数字与 - _）—— 中文 id 会让整个工作流在解析阶段就失败，
  # 而且报的是「workflow file issue」，看不出是哪一行。中文放 name。
  toolchain:
    name: 工具链
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 装依赖
        # engines 说支持 22.13 起的两条线，三格替这句话作证：下界、Active LTS、Current。
        # 跳过 Playwright 内核下载：这条作业不起浏览器。
        # 不要用 --ignore-scripts，那会连累别的包。
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check:code

  smoke:
    name: 冒烟
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: 冒烟截图
          path: .shots/smoke/
          retention-days: 7
