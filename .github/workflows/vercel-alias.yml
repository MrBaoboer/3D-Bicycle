name: 同步主地址

# 推到 main，Vercel 的 Git 集成自己会出一次生产部署，项目自带的
# 3d-bicycle-tau.vercel.app 在域名表里，会自动跟上。
# 裸域名 3d-bicycle.vercel.app 进不了那张表（报 alias_conflict，
# 缘由写在 tools/vercel-alias.mjs 开头），只能是一条别名 ——
# 别名指的是某一个具体部署，所以得发一次指一次。这条工作流就是干这个的。
# 它没跑，主地址就停在上一版，而且照样返回 200，肉眼看不出来。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 连着推几次，只有最新那次有意义；排队中的作废，正在跑的也一起
concurrency:
  group: vercel-alias
  cancel-in-progress: true

jobs:
  # 作业 id 必须是 ASCII —— 中文 id 会让工作流在解析阶段直接失败
  alias:
    name: 指到最新生产部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # 脚本只用 fetch，不装依赖，所以没有 npm ci 这一步
      - name: 对准别名
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 推上来的这次要认准这个 commit 的部署，别指到别人刚发的那一版上；
          # 手动触发时留空，表示「拿最新那个」
          MATCH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::没有配 VERCEL_TOKEN —— 主地址会停在上一次部署"
            exit 0
          fi
          node tools/vercel-alias.mjs
