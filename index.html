<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>从零组装一辆山地自行车 · 3D 分步说明书</title>
<meta name="description" content="一辆全避震山地车，从一根车架装到能骑走。二十七个大件，每一件都亲眼看着装上去。" />
<meta name="color-scheme" content="light dark" />
<!-- 地址栏配色。值由界面层按当前主题的 --paper 令牌写入，见 ui/hud.js 的 #paintTheme -->
<meta name="theme-color" content="#e9ecf1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚲</text></svg>" />
</head>
<body>
  <canvas id="stage" aria-label="三维装配画面"></canvas>

  <!--
    封面。读模型的那几秒它是一块不透明的挡板；车一到就化成一层高斯模糊，
    那台车隔着毛玻璃透出来 —— 封面图是它本身，不是一张贴上去的图。
    字只留三样：这是什么、从哪儿开始、不会用怎么办。
  -->
  <div id="cover">
    <div class="cover-in">
      <h1 class="cover-t">从零组装<br />一辆山地自行车</h1>
      <div class="cover-bar"><i id="cover-bar"></i></div>
      <p id="cover-msg" class="cover-msg">正在把车搬进来</p>
      <div id="cover-act" hidden></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
